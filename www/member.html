<!doctype html>
<html lang="en-NZ">
<head>

  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#032306">
  <title>My registration · Ngāti Kuri</title>
  <link rel="icon" href="assets/ngatikuri-logo.png">

    <div class="wrap">
      <a class="brand" href="/"><img src="assets/ngatikuri-logo.png" alt="Ngāti Kuri"><span>Ngāti Kuri Iwi Register</span></a>

 <script type="module" src="/session.js"></script>
